<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Limon Refrigerator — Online Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#17212b;font-family:Arial,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(135deg,#075b46,#10a579);color:#fff;padding:15px;position:sticky;top:0;z-index:10}.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;opacity:.9}button{border:0;border-radius:11px;padding:10px 13px;background:#087653;color:#fff;font-weight:800;font-size:14px}button.alt{background:#e5f5ef;color:#075d46}button.red{background:#c83a3a}button.gray{background:#e9eef2;color:#263445}button:disabled{opacity:.55}main{max-width:1100px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.panel{background:#fff;border-radius:17px;box-shadow:0 4px 18px #0000000d}.card{padding:14px}.lbl{font-size:13px;color:#697586}.num{font-size:25px;font-weight:900;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #d6dde5;border-radius:11px;background:#fff;font-size:14px}.search{flex:1;min-width:190px}.monthSelect{min-width:180px;font-weight:700}.title{padding:14px 16px;font-weight:900;border-bottom:1px solid #edf0f2}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:11px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px}th{background:#fafbfc;color:#687385}.pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:12px;font-weight:800}.p{background:#dcf7e8;color:#087447}.d{background:#fff0d2;color:#9b5d00}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;padding:35px;color:#7b8491}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:12px;overflow:auto}.modal.show{display:block}.box{max-width:780px;margin:3vh auto;background:#fff;border-radius:19px;padding:18px}.box h2{margin:0 0 14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form label{font-size:12px;color:#667085}.form input,.form select{width:100%;padding:13px;margin-top:5px;border:1px solid #d6dce4;border-radius:11px;font-size:15px}.end{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;flex-wrap:wrap}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.month{border:1px solid #e0e5eb;border-radius:13px;padding:11px}.month b{display:block;margin-bottom:7px}.printHead{display:none}.summary{background:#f7faf9;border-radius:12px;padding:12px;margin-bottom:12px}.summary b{margin-right:15px}.status{margin:10px 0;padding:10px;border-radius:10px;background:#fff7df;color:#805b00;display:none}.status.show{display:block}.spinner{opacity:.7}
@media print{ @page{size:A4;margin:10mm}body{background:#fff;color:#000}header{position:static;background:#fff;color:#000;border-bottom:1px solid #ccc}.printHead{display:block;font-size:18px;font-weight:800;margin:8px 0 10px}header button,.toolbar,.actions,.modal,.status{display:none!important}main{max-width:none;padding:0}.cards{grid-template-columns:repeat(4,1fr);gap:6px}.card,.panel{box-shadow:none;border:1px solid #ddd}.card{padding:8px}.num{font-size:16px}.title{font-size:16px}.scroll{overflow:visible}table{min-width:0;width:100%;font-size:10px}th,td{padding:6px;font-size:10px}.pill{padding:2px 5px}}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.months{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.form,.months{grid-template-columns:1fr}.brand{font-size:18px}.top button{padding:9px}.toolbar select{flex:1}.monthSelect{min-width:150px}}
</style></head><body>
<header><div class="top"><div><div class="brand">🧊 Limon Refrigerator</div><div class="sub">ফ্রিজ ভাড়া ও কাস্টমার হিসাব — Online</div></div><div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end"><button class="alt" type="button" id="customerBtn">👤 Customer Login</button><button type="button" id="addBtn">+ কাস্টমার</button></div></div></header>
<main>
<div class="status" id="status"></div>
<div class="cards"><div class="card"><div class="lbl">মোট কাস্টমার</div><div class="num" id="sCustomers">0</div></div><div class="card"><div class="lbl">মোট ফ্রিজ</div><div class="num" id="sFridges">0</div></div><div class="card"><div class="lbl" id="paidLabel">এই মাসের আদায়</div><div class="num" id="sPaid">৳0</div></div></div>
<div class="toolbar"><input id="search" class="search" placeholder="নাম / মোবাইল / ফ্রিজ কোড / ঠিকানা খুঁজুন"><select id="monthSelect" class="monthSelect" aria-label="মাস নির্বাচন"></select><select id="filter"><option value="all">সব কাস্টমার</option><option value="paid">নির্বাচিত মাসে আদায়</option><option value="due">নির্বাচিত মাসে বকেয়া</option></select><button class="alt" type="button" id="backupBtn">💾 Backup</button><button type="button" id="refreshBtn">🔄 Refresh</button><button type="button" id="printBtn">🖨️ Print</button></div>
<div class="printHead" id="printHead">Limon Refrigerator — নির্বাচিত মাসের হিসাব</div>
<div class="panel"><div class="title">কাস্টমার তালিকা</div><div class="scroll"><table><thead><tr><th>নাম</th><th>মোবাইল</th><th>ফ্রিজ কোড</th><th>ফ্রিজ</th><th>ভাড়া</th><th>নির্বাচিত মাস</th><th>মোট আদায়</th><th>মোট বকেয়া</th><th>কাজ</th></tr></thead><tbody id="list"></tbody></table></div></div>
</main>
<div class="modal" id="customerModal"><div class="box"><h2 id="customerTitle">নতুন কাস্টমার</h2><div class="form"><label>নাম*<input id="name"></label><label>মোবাইল<input id="phone" inputmode="tel"></label><label>ফ্রিজ কোড<input id="fridgeCode" type="text" placeholder="যেমন: LR-001"></label><label>ফ্রিজ সংখ্যা<input id="fridge" type="number" min="1" value="1"></label><label>মাসিক ভাড়া<input id="rent" type="number" min="0"></label><label>ব্র্যান্ড<input id="brand"></label><label>শুরু তারিখ<input id="start" type="date"></label><label>অগ্রিম<input id="advance" type="number" min="0" value="0"></label><label>ঠিকানা<input id="address"></label></div><div class="end"><button class="gray" type="button" id="cancelCustomer">বাতিল</button><button type="button" id="saveCustomerBtn">সংরক্ষণ</button></div></div></div>
<div class="modal" id="monthsModal"><div class="box"><h2 id="monthsTitle"></h2><div id="accountSummary" class="summary"></div><div id="months" class="months"></div><div class="end"><button class="gray" type="button" id="closeMonths">বন্ধ</button></div></div></div>
<script>
'use strict';
const SUPABASE_URL='https://smfuvhiaocghulpqzxfl.supabase.co';
const SUPABASE_KEY='sb_publishable_ok9bRG-NQBe9_94YrGPKEw_OI_0lDOc';
const API=SUPABASE_URL+'/rest/v1';
let customers=[],payments=[],editId=null,accountId=null;
const $=id=>document.getElementById(id);const monthNames=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function money(n){return '৳'+Number(n||0).toLocaleString('bn-BD')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function keyLabel(k){const [y,m]=k.split('-').map(Number);return monthNames[m-1]+' '+y}
function showStatus(t,error=false){$('status').textContent=t;$('status').style.display='block';$('status').classList.toggle('show',true);$('status').style.background=error?'#fff0ef':'#e9f8f1';$('status').style.color=error?'#a42318':'#075d46'}
async function api(path,options={}){const h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Accept':'application/json',...(options.headers||{})};const r=await fetch(API+path,{...options,headers:h});const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){}if(!r.ok)throw new Error(data?.message||data?.hint||txt||('HTTP '+r.status));return data}
async function loadOnline(){showStatus('ডেটা লোড হচ্ছে...');try{customers=await api('/customers?select=*&order=created_at.asc');payments=await api('/payments?select=*&order=payment_date.asc');customers=Array.isArray(customers)?customers:[];payments=Array.isArray(payments)?payments:[];setupMonths();render();showStatus('✅ Supabase Online Database সংযুক্ত আছে');}catch(e){showStatus('❌ Database সংযোগ/লোড সমস্যা: '+e.message,true);customers=[];payments=[];setupMonths();render()}}
function allMonthKeys(){const s={};const now=new Date();for(let i=-12;i<=24;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);s[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')]=1}payments.forEach(p=>{if(p.payment_month)s[p.payment_month]=1});customers.forEach(c=>{if(c.start){const d=new Date(c.start+'T00:00:00');s[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')]=1}});return Object.keys(s).sort()}
function setupMonths(){const sel=$('monthSelect'),old=sel.value,keys=allMonthKeys();sel.innerHTML=keys.map(k=>`<option value="${k}">${keyLabel(k)}${k===todayKey()?' — এই মাস':''}</option>`).join('');sel.value=keys.includes(old)?old:(keys.includes(todayKey())?todayKey():keys[keys.length-1])}function selectedKey(){return $('monthSelect').value||todayKey()}
function paidFor(c,k){return payments.filter(p=>p.customer_id===c.id&&p.payment_month===k).reduce((s,p)=>s+Number(p.amount||0),0)}function totalPaid(c){return payments.filter(p=>p.customer_id===c.id).reduce((s,p)=>s+Number(p.amount||0),0)}
function dueForYear(c,y){const rent=Number(c.rent??c.monthly_rent??0);if(!rent)return 0;const start=c.start?new Date(c.start+'T00:00:00'):new Date(y,0,1);let count=0;for(let m=0;m<12;m++){const d=new Date(y,m,1);if(d>=new Date(start.getFullYear(),start.getMonth(),1)&&d<=new Date(y,11,1))count++}const paidMonths=new Set(payments.filter(p=>p.customer_id===c.id&&String(p.payment_month||'').startsWith(String(y))).map(p=>p.payment_month));return Math.max(0,(count-paidMonths.size)*rent)}
function render(){const k=selectedKey();$('printHead').textContent='Limon Refrigerator — '+keyLabel(k)+' — কাস্টমার হিসাব';const q=$('search').value.trim().toLowerCase(),f=$('filter').value;let arr=customers.filter(c=>(c.name+' '+(c.phone||'')+' '+(c.address||'')+' '+(c.brand||'')+' '+(c.fridge_code||'')).toLowerCase().includes(q));if(f==='paid')arr=arr.filter(c=>paidFor(c,k)>0);if(f==='due')arr=arr.filter(c=>paidFor(c,k)<=0);$('sCustomers').textContent=customers.length;$('sFridges').textContent=customers.reduce((s,c)=>s+Number(c.fridge||0),0);$('paidLabel').textContent=keyLabel(k)+' আদায়';$('sPaid').textContent=money(customers.reduce((s,c)=>s+paidFor(c,k),0));$('list').innerHTML=arr.length?arr.map(c=>{const p=paidFor(c,k);return `<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.address)}</small></td><td>${esc(c.phone)}</td><td><b>${esc(c.fridge_code||'')}</b></td><td>${Number(c.fridge||0)}</td><td>${money(c.rent??c.monthly_rent)}</td><td>${p?'<span class="pill p">আদায় '+money(p)+'</span>':'<span class="pill d">বকেয়া</span>'}</td><td><b>${money(totalPaid(c))}</b></td><td><b>${money(dueForYear(c,Number(k.slice(0,4))))}</b></td><td><div class="actions"><button type="button" data-action="account" data-id="${c.id}">হিসাব</button><button type="button" class="alt" data-action="edit" data-id="${c.id}">এডিট</button><button type="button" class="red" data-action="delete" data-id="${c.id}">মুছুন</button></div></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">কোনো কাস্টমার নেই</td></tr>'}
function openCustomer(c){editId=c?c.id:null;$('customerTitle').textContent=c?'কাস্টমার এডিট':'নতুন কাস্টমার';$('name').value=c?.name||'';$('phone').value=c?.phone||'';$('fridgeCode').value=c?.fridge_code||'';$('fridge').value=c?.fridge||1;$('rent').value=c?.rent??c?.monthly_rent??'';$('brand').value=c?.brand||'';$('start').value=c?.start||'';$('advance').value=c?.advance||0;$('address').value=c?.address||'';$('customerModal').classList.add('show')}
function closeCustomer(){$('customerModal').classList.remove('show')}
async function saveCustomer(){const n=$('name').value.trim(),code=$('fridgeCode').value.trim();if(!n){alert('কাস্টমারের নাম লিখুন');return}if(!code){alert('ফ্রিজ কোড লিখুন');return}const obj={name:n,phone:$('phone').value.trim(),fridge_code:code,fridge:Number($('fridge').value)||1,rent:Number($('rent').value)||0,monthly_rent:Number($('rent').value)||0,brand:$('brand').value.trim(),start:$('start').value||null,advance:Number($('advance').value)||0,address:$('address').value.trim()};try{if(editId)await api('/customers?id=eq.'+encodeURIComponent(editId),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});else await api('/customers',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});closeCustomer();await loadOnline();alert('কাস্টমার সফলভাবে সংরক্ষণ হয়েছে');}catch(e){alert('সংরক্ষণ হয়নি: '+e.message)}}
function openMonths(id){accountId=id;const c=customers.find(x=>x.id===id);if(!c)return;const y=Number(selectedKey().slice(0,4));$('monthsTitle').innerHTML=esc(c.name)+' — '+y+' সালের হিসাব';$('accountSummary').innerHTML='<b>মোট আদায়: '+money(totalPaid(c))+'</b><b>এই বছরে বকেয়া: '+money(dueForYear(c,y))+'</b>';$('months').innerHTML=Array.from({length:12},(_,i)=>{const k=y+'-'+String(i+1).padStart(2,'0'),ps=payments.filter(p=>p.customer_id===c.id&&p.payment_month===k),p=ps[ps.length-1];return `<div class="month"><b>${monthNames[i]} ${y}</b>${p?`<span class="pill p">আদায় ${money(p.amount)}</span><br><small>${esc(p.payment_date||'')}</small><br><button class="red" type="button" data-pay="clear" data-key="${k}" style="margin-top:7px">বাতিল</button>`:`<span class="pill d">বকেয়া</span><br><button type="button" data-pay="take" data-key="${k}" style="margin-top:7px">আদায়</button>`}</div>`}).join('');$('monthsModal').classList.add('show')}
async function takePayment(k){const c=customers.find(x=>x.id===accountId);if(!c)return;let a=prompt('আদায়ের টাকা লিখুন:',String(c.rent||c.monthly_rent||0));if(a===null)return;a=Number(a);if(!Number.isFinite(a)||a<0){alert('সঠিক টাকা লিখুন');return}try{const old=payments.find(p=>p.customer_id===c.id&&p.payment_month===k);const obj={customer_id:c.id,amount:a,payment_date:new Date().toISOString().slice(0,10),payment_month:k};if(old)await api('/payments?id=eq.'+encodeURIComponent(old.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});else await api('/payments',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});await loadOnline();openMonths(accountId)}catch(e){alert('পেমেন্ট সংরক্ষণ হয়নি: '+e.message)}}
async function clearPayment(k){if(!confirm('এই মাসের আদায় বাতিল করবেন?'))return;try{await api('/payments?customer_id=eq.'+encodeURIComponent(accountId)+'&payment_month=eq.'+encodeURIComponent(k),{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadOnline();openMonths(accountId)}catch(e){alert('আদায় বাতিল হয়নি: '+e.message)}}
async function deleteCustomer(id){if(!confirm('এই কাস্টমার এবং তার পেমেন্ট হিসাব মুছে ফেলবেন?'))return;try{await api('/customers?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadOnline();alert('কাস্টমার মুছে ফেলা হয়েছে')}catch(e){alert('মুছতে সমস্যা: '+e.message)}}
function downloadBackup(){const payload={app:'Limon Refrigerator',source:'Supabase Online',created:new Date().toISOString(),customers,payments};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='limon-refrigerator-online-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('addBtn').onclick=()=>openCustomer(null);$('customerBtn').onclick=()=>location.href='customer.html';$('cancelCustomer').onclick=closeCustomer;$('saveCustomerBtn').onclick=saveCustomer;$('search').oninput=render;$('monthSelect').onchange=render;$('filter').onchange=render;$('backupBtn').onclick=downloadBackup;$('refreshBtn').onclick=loadOnline;$('printBtn').onclick=()=>window.print();$('closeMonths').onclick=()=>$('monthsModal').classList.remove('show');$('list').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='account')openMonths(b.dataset.id);if(b.dataset.action==='edit')openCustomer(customers.find(c=>c.id===b.dataset.id));if(b.dataset.action==='delete')deleteCustomer(b.dataset.id)};$('months').onclick=e=>{const b=e.target.closest('[data-pay]');if(!b)return;b.dataset.pay==='take'?takePayment(b.dataset.key):clearPayment(b.dataset.key)};
loadOnline();
</script></body></html>
