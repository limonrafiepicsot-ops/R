<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Limon Refrigerator — Customer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#17212b;font-family:Arial,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(135deg,#075b46,#10a579);color:#fff;padding:18px 15px}.top{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;opacity:.9}main{max-width:900px;margin:auto;padding:15px}.panel,.card{background:#fff;border-radius:17px;box-shadow:0 4px 18px #0000000d}.login{max-width:520px;margin:25px auto;padding:20px}h2{margin:0 0 8px}.hint{color:#687385;font-size:13px;margin-bottom:16px}input,select{width:100%;padding:14px;border:1px solid #d6dde5;border-radius:11px;font-size:16px;background:#fff}button{border:0;border-radius:11px;padding:11px 15px;background:#087653;color:#fff;font-weight:800;font-size:14px}button.gray{background:#e9eef2;color:#263445}.err{color:#b42318;background:#fff0ef;border-radius:10px;padding:10px;margin-top:10px;display:none}.profile{padding:17px;margin-bottom:12px}.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f7faf9;border-radius:12px;padding:12px}.lbl{font-size:12px;color:#697586}.num{font-size:20px;font-weight:900;margin-top:4px}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:14px}.info div{padding:9px;background:#fafbfc;border-radius:9px}.title{padding:14px 16px;font-weight:900;border-bottom:1px solid #edf0f2}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:11px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px}th{background:#fafbfc;color:#687385}.pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:12px;font-weight:800}.p{background:#dcf7e8;color:#087447}.d{background:#fff0d2;color:#9b5d00}.empty{text-align:center;padding:30px;color:#7b8491}.hidden{display:none}.monthbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.status{padding:10px;border-radius:10px;background:#e9f8f1;color:#075d46;display:none}.status.show{display:block}@media(max-width:600px){.profileGrid{grid-template-columns:1fr}.info{grid-template-columns:1fr}.brand{font-size:18px}.monthbar{grid-template-columns:1fr}}@media print{@page{size:A4;margin:10mm}body{background:#fff;color:#000}header{background:#fff;color:#000;border-bottom:1px solid #ccc}.noPrint{display:none!important}.panel,.card{box-shadow:none;border:1px solid #ddd}main{max-width:none;padding:0}.scroll{overflow:visible}table{min-width:0;width:100%}th,td{padding:7px;font-size:10px}.pill{padding:2px 5px}}
</style></head><body>
<header><div class="top"><div><div class="brand">🧊 Limon Refrigerator</div><div class="sub">কাস্টমার হিসাব নিকাশ — Online</div></div><button class="gray noPrint" id="logoutBtn" style="display:none">লগআউট</button></div></header>
<main><section class="panel login" id="loginBox"><h2>🔐 Customer Login</h2><div class="hint">আপনার ফ্রিজ কোড লিখে অনলাইন হিসাব দেখতে লগইন করুন।</div><input id="code" placeholder="ফ্রিজ কোড — যেমন LR-001" autocomplete="off"><div style="margin-top:10px"><button id="loginBtn" style="width:100%">Login</button></div><div class="err" id="error"></div></section>
<section id="accountBox" class="hidden"><div class="panel profile"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h2 id="custName"></h2><div class="hint" id="custCode"></div></div><button class="noPrint" id="printBtn">🖨️ প্রিন্ট</button></div><div class="info"><div><b>মোবাইল:</b> <span id="phone"></span></div><div><b>ঠিকানা:</b> <span id="address"></span></div><div><b>ফ্রিজ:</b> <span id="fridge"></span></div><div><b>মাসিক ভাড়া:</b> <span id="rent"></span></div></div><div class="profileGrid"><div class="stat"><div class="lbl">মোট আদায়</div><div class="num" id="totalPaid">৳0</div></div><div class="stat"><div class="lbl">মোট বকেয়া</div><div class="num" id="totalDue">৳0</div></div><div class="stat"><div class="lbl">হিসাবের মাস</div><div class="num" id="totalMonths">0</div></div></div></div>
<div class="panel"><div class="title">মাসভিত্তিক হিসাব</div><div class="monthbar"><select id="yearSelect" aria-label="সাল নির্বাচন"></select><select id="monthSelect" aria-label="মাস নির্বাচন"></select></div><div class="scroll"><table><thead><tr><th>মাস</th><th>মাসিক ভাড়া</th><th>জমা টাকা</th><th>জমার তারিখ</th><th>বকেয়া</th><th>অবস্থা</th></tr></thead><tbody id="history"></tbody></table></div></div></section></main>
<script>
'use strict';const SUPABASE_URL='https://smfuvhiaocghulpqzxfl.supabase.co',SUPABASE_KEY='sb_publishable_ok9bRG-NQBe9_94YrGPKEw_OI_0lDOc',API=SUPABASE_URL+'/rest/v1';let current=null,payments=[];const $=id=>document.getElementById(id);const monthNames=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];function money(n){return '৳'+Number(n||0).toLocaleString('bn-BD')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,options={}){const h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Accept':'application/json',...(options.headers||{})};const r=await fetch(API+path,{...options,headers:h});const txt=await r.text();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){}if(!r.ok)throw new Error(d?.message||d?.hint||txt||('HTTP '+r.status));return d}function normalize(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'')}function showError(t){$('error').textContent=t;$('error').style.display='block'}function monthKey(y,m){return y+'-'+String(m).padStart(2,'0')}function setupSelectors(){const now=new Date(),ys=[];const start=current?.start?new Date(current.start+'T00:00:00'):new Date(now.getFullYear(),0,1);for(let y=start.getFullYear();y<=now.getFullYear();y++)ys.push(y);$('yearSelect').innerHTML=ys.map(y=>`<option value="${y}">${y} সাল</option>`).join('');$('yearSelect').value=now.getFullYear();$('monthSelect').innerHTML=monthNames.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');$('monthSelect').value=String(now.getMonth()+1)}function renderAccount(){const c=current,rent=Number(c.rent??c.monthly_rent??0),y=Number($('yearSelect').value),m=Number($('monthSelect').value),k=monthKey(y,m),p=payments.find(x=>x.payment_month===k),paid=Number(p?.amount||0),due=Math.max(rent-paid,0);$('custName').textContent=c.name||'কাস্টমার';$('custCode').textContent='ফ্রিজ কোড: '+(c.fridge_code||'');$('phone').textContent=c.phone||'—';$('address').textContent=c.address||'—';$('fridge').textContent=String(c.fridge||1);$('rent').textContent=money(rent);const now=new Date();let dueTotal=0,monthCount=0;if(rent){const start=current.start?new Date(current.start+'T00:00:00'):new Date(now.getFullYear(),0,1);let yy=start.getFullYear(),mm=start.getMonth()+1;while(yy<now.getFullYear()||(yy===now.getFullYear()&&mm<=now.getMonth()+1)){const kk=monthKey(yy,mm),pp=payments.find(x=>x.payment_month===kk),pa=Number(pp?.amount||0);dueTotal+=Math.max(rent-pa,0);monthCount++;mm++;if(mm>12){mm=1;yy++}}}$('totalPaid').textContent=money(payments.reduce((s,x)=>s+Number(x.amount||0),0));$('totalDue').textContent=money(dueTotal);$('totalMonths').textContent=monthCount;$('history').innerHTML=`<tr><td><b>${monthNames[m-1]} ${y}</b></td><td>${money(rent)}</td><td>${money(paid)}</td><td>${p?esc(p.payment_date||'—'):'—'}</td><td><b>${money(due)}</b></td><td>${due===0?'<span class="pill p">পরিশোধিত</span>':'<span class="pill d">বকেয়া</span>'}</td></tr>`}function nowMonth(y){const n=new Date();return y===n.getFullYear()?n.getMonth()+1:(y<n.getFullYear()?12:0)}async function login(){const code=normalize($('code').value);if(!code){showError('ফ্রিজ কোড লিখুন।');return}try{const rows=await api('/customers?select=*&fridge_code=eq.'+encodeURIComponent(code));if(!rows?.length){showError('এই ফ্রিজ কোডের কোনো কাস্টমার পাওয়া যায়নি।');return}if(rows.length>1){showError('এই ফ্রিজ কোড একাধিক কাস্টমারের আছে। Admin থেকে কোড ঠিক করুন।');return}current=rows[0];payments=await api('/payments?select=*&customer_id=eq.'+encodeURIComponent(current.id)+'&order=payment_month.asc');$('loginBox').classList.add('hidden');$('accountBox').classList.remove('hidden');$('logoutBtn').style.display='block';$('error').style.display='none';setupSelectors();renderAccount()}catch(e){showError('Online Database সংযোগ সমস্যা: '+e.message)}}$('loginBtn').onclick=login;$('code').onkeydown=e=>{if(e.key==='Enter')login()};$('yearSelect').onchange=renderAccount;$('monthSelect').onchange=renderAccount;$('logoutBtn').onclick=()=>{current=null;payments=[];$('accountBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('logoutBtn').style.display='none';$('code').value='';$('error').style.display='none'};$('printBtn').onclick=()=>window.print();
</script></body></html>
